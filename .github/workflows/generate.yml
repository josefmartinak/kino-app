name: Generate Kino JSON

on:
  schedule:
    - cron: "45 9 * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run generator
        run: python getJSON.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kino-frenstat.json docs/kino-frenstat.meta.json
          git diff --cached --quiet || (git commit -m "Update kino JSON" && git push)
